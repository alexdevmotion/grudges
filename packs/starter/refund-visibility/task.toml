schema_version = "1.4"

[task]
name = "starter/refund-visibility"
version = "1.0.3"
description = "Hide screening from customers while keeping the refund blocked"

[metadata]
source_session = "episode-03"
category = "behavior-regression"
mode = "shareable"
visibility = "public"
difficulty = "routine"

[agent]
timeout_sec = 1200.0
network_mode = "allowlist"
allowed_hosts = ["api.openai.com"]

[verifier]
timeout_sec = 120.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 2048
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "deb.debian.org", "raw.githubusercontent.com", "github.com", "objects.githubusercontent.com", "nodejs.org", "registry.npmjs.org", "pypi.org", "files.pythonhosted.org"]

[local]
verify = ["{python}", "{task}/tests/verify.py"]
solve = ["bash", "{task}/solution/solve.sh"]
