[project]
name = "grudges"
version = "0.3.0a1"
description = "Turn agent mistakes into regression tests. Replay with your Codex or Claude subscription."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Alex Constantin"}]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/alexdevmotion/grudges"
Issues = "https://github.com/alexdevmotion/grudges/issues"

[project.scripts]
grudges = "grudges.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grudges"]

[tool.hatch.build.targets.wheel.force-include]
"packs" = "grudges/packs"

[tool.hatch.build.targets.sdist]
include = ["src", "packs", "tests", "scripts", "docs", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", "RELEASING.md", "RELEASE-CHECKS.md", "LICENSE", "NOTICE", "pyproject.toml"]
